name: Platform PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  deterministic-gate:
    if: github.event.pull_request.draft == false
    uses: iotyndall/agentic-platform-operations/.github/workflows/reusable-pr-deterministic-gate.yml@PINNED_REF

  independent-review:
    if: github.event.pull_request.draft == false
    needs: [deterministic-gate]
    uses: iotyndall/agentic-platform-operations/.github/workflows/reusable-engineering-review.yml@PINNED_REF
    with:
      pull_request_number: ${{ github.event.pull_request.number }}
      expected_head_sha: ${{ github.event.pull_request.head.sha }}
      declared_risk: ${{ needs.deterministic-gate.outputs.risk }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
