name: Reusable protected release gate

on:
  workflow_call:
    inputs:
      pull_request_number:
        required: true
        type: string
      candidate_sha:
        required: true
        type: string
      reviewed_head_sha:
        required: true
        type: string
      ci_verified_sha:
        required: true
        type: string
      target_environment:
        required: true
        type: string
      environment_name:
        required: true
        type: string
      slo_status:
        required: false
        type: string
        default: not-required
      slo_evidence_sha256:
        required: false
        type: string
        default: ''
      manual_high_risk_release:
        description: 'May be true only from a workflow_dispatch caller; critical risk is never authorized by this workflow'
        required: false
        type: boolean
        default: false
      config_path:
        required: false
        type: string
        default: '.agentic/platform-ops.json'
    outputs:
      authorized:
        value: ${{ jobs.gate.outputs.authorized }}
      effective_risk:
        value: ${{ jobs.gate.outputs.effective_risk }}
      release_evidence_json:
        value: ${{ jobs.gate.outputs.release_evidence_json }}

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment_name }}
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      effective_risk: ${{ steps.gate.outputs.effective_risk }}
      release_evidence_json: ${{ steps.gate.outputs.release_evidence_json }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.pull_request_number }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      REVIEWED_HEAD_SHA: ${{ inputs.reviewed_head_sha }}
      CI_VERIFIED_SHA: ${{ inputs.ci_verified_sha }}
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      ENVIRONMENT_NAME: ${{ inputs.environment_name }}
      SLO_STATUS: ${{ inputs.slo_status }}
      SLO_EVIDENCE_SHA256: ${{ inputs.slo_evidence_sha256 }}
      MANUAL_HIGH_RISK: ${{ inputs.manual_high_risk_release }}
      CONFIG_PATH: ${{ inputs.config_path }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_sha }}
          submodules: false

      - name: Verify immutable review, CI, integrated tree, environment, staging, SLO, and rollback preconditions
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          test -f "$CONFIG_PATH" || { echo "::error::Missing $CONFIG_PATH"; exit 1; }
          python - <<'PY'
          import os,re
          for name in ('CANDIDATE_SHA','REVIEWED_HEAD_SHA','CI_VERIFIED_SHA'):
              if not re.fullmatch(r'[0-9a-f]{40}',os.environ[name]): raise SystemExit(f'{name} must be a full 40-character SHA')
          if os.environ['TARGET_ENVIRONMENT'] not in {'staging','production'}: raise SystemExit('invalid target environment')
          PY
          jq -e --arg repo "$GITHUB_REPOSITORY" '.project.repository == $repo' "$CONFIG_PATH" >/dev/null

          if [ "$TARGET_ENVIRONMENT" = staging ]; then
            EXPECTED_ENV="$(jq -r '.environments.staging.name' "$CONFIG_PATH")"
          else
            EXPECTED_ENV="$(jq -r '.environments.production.name' "$CONFIG_PATH")"
            jq -e '.environments.production.protected == true and (.environments.production.credentials == "environment" or .environments.production.credentials == "oidc")' "$CONFIG_PATH" >/dev/null || {
              echo '::error::Production contract must require a protected environment with environment-scoped or OIDC credentials.'; exit 1
            }
          fi
          test "$ENVIRONMENT_NAME" = "$EXPECTED_ENV" || { echo '::error::Caller environment does not match protected project contract'; exit 1; }
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" || { echo '::error::Candidate checkout mismatch'; exit 1; }
          test "$CI_VERIFIED_SHA" = "$CANDIDATE_SHA" || { echo '::error::CI attestation is not for the candidate SHA'; exit 1; }

          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          test "$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")" = "$REVIEWED_HEAD_SHA" || { echo '::error::Reviewed SHA is not the PR head'; exit 1; }
          jq -e '.merged_at != null' "$RUNNER_TEMP/pr.json" >/dev/null || { echo '::error::Release requires a merged PR'; exit 1; }
          BASE_SHA="$(jq -r '.base.sha' "$RUNNER_TEMP/pr.json")"

          git fetch --no-tags origin "$REVIEWED_HEAD_SHA" "$BASE_SHA" >/dev/null 2>&1
          CANDIDATE_TREE="$(git rev-parse "$CANDIDATE_SHA^{tree}")"
          REVIEWED_TREE="$(git rev-parse "$REVIEWED_HEAD_SHA^{tree}")"
          test "$CANDIDATE_TREE" = "$REVIEWED_TREE" || {
            echo '::error::Merged candidate tree differs from the independently reviewed PR head tree. Re-review the integrated result.'; exit 1
          }

          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" > "$RUNNER_TEMP/comments.json"
          REVIEW_RISK="$(python - "$RUNNER_TEMP/comments.json" "$REVIEWED_HEAD_SHA" <<'PY'
          import json,re,sys
          comments=json.load(open(sys.argv[1])); sha=sys.argv[2]
          for c in reversed(comments):
              if c.get('user',{}).get('login')!='github-actions[bot]': continue
              body=c.get('body') or ''
              if '<!-- agentic-engineering-review:v1 -->' not in body: continue
              m=re.search(r'```json\s*(\{.*?\})\s*```',body,re.S)
              if not m: continue
              try: d=json.loads(m.group(1))
              except Exception: continue
              if d.get('reviewed_head_sha')==sha and d.get('disposition')=='PASS' and d.get('engineering_ready') is True:
                  print(d.get('risk','high')); break
          else: raise SystemExit('No valid PASS engineering review for exact PR head')
          PY
          )" || { echo '::error::Independent review evidence missing or invalid'; exit 1; }

          PROTECTED_RE="$(jq -r '.risk.protectedPathRegex' "$CONFIG_PATH")"
          git diff --name-only "$BASE_SHA...$REVIEWED_HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          CENTRAL_HIGH='^(\.github/|\.agentic/|infrastructure/|terraform/|supabase/migrations/|auth/|billing/|security/)|(^|/)(Dockerfile|compose[^/]*\.ya?ml|agent-policy\.md)$'
          if grep -Eiq -- "$CENTRAL_HIGH" "$RUNNER_TEMP/changed.txt" || grep -Eiq -- "$PROTECTED_RE" "$RUNNER_TEMP/changed.txt"; then
            MECHANICAL_RISK=high
          elif awk '/(^|\/)(docs?|tests?|__tests__|fixtures?)\// {next} /\.(md|txt|test\.[^.]+|spec\.[^.]+)$/ {next} {exit 1}' "$RUNNER_TEMP/changed.txt"; then
            MECHANICAL_RISK=low
          else
            MECHANICAL_RISK=moderate
          fi
          EFFECTIVE_RISK="$(python - "$MECHANICAL_RISK" "$REVIEW_RISK" <<'PY'
          import sys
          order={'low':0,'moderate':1,'high':2,'critical':3}; a,b=sys.argv[1:]
          if a not in order or b not in order: raise SystemExit('invalid risk evidence')
          print(max((a,b),key=order.get))
          PY
          )"
          echo "effective_risk=$EFFECTIVE_RISK" >> "$GITHUB_OUTPUT"

          STAGING_VERIFIED=false
          STAGING_HASH=''
          ROLLBACK_AVAILABLE=false
          SLO_EFFECTIVE="$SLO_STATUS"
          REASONS=()
          AUTH=true

          if [ "$TARGET_ENVIRONMENT" = production ]; then
            DEFAULT_BRANCH="$(jq -r '.project.defaultBranch' "$CONFIG_PATH")"
            git fetch --no-tags origin "$DEFAULT_BRANCH" >/dev/null 2>&1
            test "$(git rev-parse "origin/$DEFAULT_BRANCH")" = "$CANDIDATE_SHA" || { echo '::error::Production candidate must be current default-branch head'; exit 1; }

            STAGING_HASH="$(python - "$RUNNER_TEMP/comments.json" "$CANDIDATE_SHA" <<'PY'
          import json,re,sys
          comments=json.load(open(sys.argv[1])); sha=sys.argv[2]
          pat=re.compile(r'<!-- agentic-deploy-verification:v1 env=staging sha='+re.escape(sha)+r' evidence=([0-9a-f]{64}) -->')
          for c in reversed(comments):
              if c.get('user',{}).get('login')!='github-actions[bot]': continue
              m=pat.search(c.get('body') or '')
              if m: print(m.group(1)); break
          PY
          )"
            if printf '%s' "$STAGING_HASH" | grep -Eq '^[0-9a-f]{64}$'; then STAGING_VERIFIED=true; else AUTH=false; REASONS+=("missing hash-bound staging verification for candidate SHA"); fi

            if jq -e '.slo.errorBudgetGating == true' "$CONFIG_PATH" >/dev/null; then
              if [ "$SLO_STATUS" != healthy ] || ! printf '%s' "$SLO_EVIDENCE_SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
                AUTH=false; REASONS+=("production SLO/error-budget gate is enabled but state is not healthy and evidenced")
              fi
            else
              SLO_EFFECTIVE=not-required
            fi

            if jq -e 'any(.mitigations[]?; .type=="rollback" and .reversible==true and (.runbook|length>0) and (.validationCommand|length>0))' "$CONFIG_PATH" >/dev/null; then
              ROLLBACK_AVAILABLE=true
            else
              AUTH=false; REASONS+=("no declared reversible rollback path with validation")
            fi

            if [ "$EFFECTIVE_RISK" = critical ]; then
              AUTH=false; REASONS+=("critical-risk releases require a human-led operational process")
            elif [ "$EFFECTIVE_RISK" = high ]; then
              if [ "$MANUAL_HIGH_RISK" != true ] || [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
                AUTH=false; REASONS+=("high-risk production release requires manual workflow_dispatch plus protected-environment approval")
              fi
            fi
          fi

          if [ "${#REASONS[@]}" -eq 0 ]; then REASONS+=("all central release preconditions satisfied"); fi
          REASONS_JSON="$(printf '%s\n' "${REASONS[@]}" | jq -R . | jq -s .)"
          EVIDENCE="$(jq -nc --arg repo "$GITHUB_REPOSITORY" --arg candidate "$CANDIDATE_SHA" --arg reviewed "$REVIEWED_HEAD_SHA" --arg env "$TARGET_ENVIRONMENT" --arg risk "$EFFECTIVE_RISK" --arg ci "$CI_VERIFIED_SHA" --arg slo "$SLO_EFFECTIVE" --argjson staging "$STAGING_VERIFIED" --argjson rollback "$ROLLBACK_AVAILABLE" --argjson auth "$AUTH" --argjson reasons "$REASONS_JSON" '{version:1,repository:$repo,candidate_sha:$candidate,reviewed_head_sha:$reviewed,target_environment:$env,risk:$risk,ci_verified_sha:$ci,review_passed:true,staging_verified:$staging,slo_status:$slo,rollback_available:$rollback,authorized:$auth,reasons:$reasons}')"
          echo "authorized=$AUTH" >> "$GITHUB_OUTPUT"
          echo "release_evidence_json=$EVIDENCE" >> "$GITHUB_OUTPUT"
          if [ "$AUTH" != true ]; then printf '::error::Release not authorized: %s\n' "${REASONS[*]}"; exit 1; fi
