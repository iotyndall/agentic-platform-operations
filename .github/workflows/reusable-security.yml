name: Reusable security ratchet

on:
  workflow_call:
    inputs:
      config_path:
        required: false
        type: string
        default: '.agentic/platform-ops.json'

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: false

      - name: Read contract
        id: contract
        shell: bash
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        run: |
          set -euo pipefail
          test -f "$CONFIG_PATH"
          jq -e --arg repo "$GITHUB_REPOSITORY" '.project.repository == $repo' "$CONFIG_PATH" >/dev/null
          echo "node_version=$(jq -r '.runtime.nodeVersion // "22"' "$CONFIG_PATH")" >> "$GITHUB_OUTPUT"
          echo "package_manager=$(jq -r '.runtime.packageManager // "pnpm"' "$CONFIG_PATH")" >> "$GITHUB_OUTPUT"
          echo "install=$(jq -r '.commands.install' "$CONFIG_PATH")" >> "$GITHUB_OUTPUT"
          echo "audit=$(jq -r '.security.dependencyAuditCommand // ""' "$CONFIG_PATH")" >> "$GITHUB_OUTPUT"
          jq -r '.security.criticalAdvisoryAllowlist[]? // empty' "$CONFIG_PATH" | sort -u > "$RUNNER_TEMP/allowed-ghsa.txt"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.contract.outputs.package_manager == 'pnpm'
        with:
          version: 10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.contract.outputs.node_version != ''
        with:
          node-version: ${{ steps.contract.outputs.node_version }}

      - name: Install dependencies
        shell: bash
        env:
          COMMAND: ${{ steps.contract.outputs.install }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Block new critical dependency advisories
        if: steps.contract.outputs.audit != ''
        shell: bash
        env:
          COMMAND: ${{ steps.contract.outputs.audit }}
        run: |
          set -euo pipefail
          set +e
          bash -euo pipefail -c "$COMMAND" > "$RUNNER_TEMP/audit.json" 2> "$RUNNER_TEMP/audit.stderr"
          status=$?
          set -e
          cat "$RUNNER_TEMP/audit.stderr" >&2 || true
          cat "$RUNNER_TEMP/audit.json"

          python - "$RUNNER_TEMP/audit.json" "$RUNNER_TEMP/found-critical-ghsa.txt" <<'PY'
          import json, re, sys

          GHSA_RE = re.compile(r'GHSA-[A-Za-z0-9-]+')

          def extract_ghsa(advisory):
              ghsa = advisory.get('github_advisory_id')
              if isinstance(ghsa, str) and GHSA_RE.fullmatch(ghsa):
                  return ghsa
              url = advisory.get('url')
              if isinstance(url, str):
                  match = GHSA_RE.search(url)
                  if match:
                      return match.group(0)
              return None

          def critical_ids(data):
              # npm audit v1 / older-compatible shape
              advisories = data.get('advisories')
              if isinstance(advisories, dict):
                  found, malformed = set(), []
                  for advisory in advisories.values():
                      if str(advisory.get('severity', '')).lower() != 'critical':
                          continue
                      ghsa = extract_ghsa(advisory)
                      if ghsa:
                          found.add(ghsa)
                      else:
                          malformed.append(str(advisory.get('github_advisory_id') or advisory.get('url')))
                  if malformed:
                      raise ValueError('Critical advisories were present without valid GHSA IDs: ' + ', '.join(malformed))
                  return found

              # npm audit v2 shape: vulnerabilities -> via (objects and/or dependency names).
              vulnerabilities = data.get('vulnerabilities')
              if isinstance(vulnerabilities, dict):
                  critical_roots = {
                      name for name, vuln in vulnerabilities.items()
                      if isinstance(vuln, dict) and str(vuln.get('severity', '')).lower() == 'critical'
                  }
                  found, malformed = set(), []

                  def walk(name, seen):
                      if name in seen:
                          return
                      seen.add(name)
                      vuln = vulnerabilities.get(name)
                      if not isinstance(vuln, dict):
                          return
                      for via in vuln.get('via', []):
                          if isinstance(via, str):
                              if via in vulnerabilities:
                                  walk(via, seen)
                              continue
                          if not isinstance(via, dict):
                              continue
                          if str(via.get('severity', '')).lower() != 'critical':
                              continue
                          ghsa = extract_ghsa(via)
                          if ghsa:
                              found.add(ghsa)
                          else:
                              malformed.append(f'{name}:{via.get("url") or via.get("source") or "unknown"}')

                  for name in sorted(critical_roots):
                      walk(name, set())

                  metadata_critical = data.get('metadata', {}).get('vulnerabilities', {}).get('critical')
                  if metadata_critical is not None:
                      try:
                          reported = int(metadata_critical)
                      except (TypeError, ValueError):
                          raise ValueError('npm audit v2 metadata.vulnerabilities.critical is not an integer')
                      if reported > 0 and not critical_roots:
                          raise ValueError('npm audit reports critical vulnerabilities but no critical vulnerability objects were found')

                  if malformed:
                      raise ValueError('Critical advisories were present without valid GHSA IDs: ' + ', '.join(malformed))
                  if critical_roots and not found:
                      raise ValueError('Critical vulnerabilities were present but no GHSA advisory ID could be resolved')
                  return found

              raise ValueError('Dependency audit JSON has neither advisories nor vulnerabilities; refusing ambiguous security evidence.')

          # Regression checks execute inside the exact parser used in every security run.
          assert critical_ids({
              'advisories': {
                  '1': {'severity': 'critical', 'github_advisory_id': 'GHSA-aaaa-bbbb-cccc'},
                  '2': {'severity': 'moderate', 'github_advisory_id': 'GHSA-dddd-eeee-ffff'},
              }
          }) == {'GHSA-aaaa-bbbb-cccc'}
          assert critical_ids({
              'vulnerabilities': {
                  'root': {'severity': 'critical', 'via': ['dep']},
                  'dep': {'severity': 'critical', 'via': [{'severity': 'critical', 'url': 'https://github.com/advisories/GHSA-1111-2222-3333'}]},
                  'moderate': {'severity': 'moderate', 'via': [{'severity': 'moderate', 'url': 'https://github.com/advisories/GHSA-4444-5555-6666'}]},
              },
              'metadata': {'vulnerabilities': {'critical': 2}}
          }) == {'GHSA-1111-2222-3333'}
          assert critical_ids({
              'vulnerabilities': {'pkg': {'severity': 'moderate', 'via': []}},
              'metadata': {'vulnerabilities': {'critical': 0}}
          }) == set()

          source, destination = sys.argv[1:]
          try:
              with open(source, encoding='utf-8') as f:
                  data = json.load(f)
              critical = critical_ids(data)
          except Exception as exc:
              raise SystemExit(f'::error::Dependency audit evidence is ambiguous: {exc}')

          with open(destination, 'w', encoding='utf-8') as f:
              for ghsa in sorted(critical):
                  f.write(ghsa + '\n')
          PY

          if [ ! -s "$RUNNER_TEMP/found-critical-ghsa.txt" ]; then
            if [ "$status" -ne 0 ]; then
              echo '::notice::Dependency audit reported lower-severity findings, but no critical advisories are present.'
            else
              echo 'No critical dependency advisories found.'
            fi
            exit 0
          fi

          comm -23 "$RUNNER_TEMP/found-critical-ghsa.txt" "$RUNNER_TEMP/allowed-ghsa.txt" > "$RUNNER_TEMP/new-ghsa.txt" || true
          comm -13 "$RUNNER_TEMP/found-critical-ghsa.txt" "$RUNNER_TEMP/allowed-ghsa.txt" > "$RUNNER_TEMP/stale-allowlist.txt" || true

          if [ -s "$RUNNER_TEMP/new-ghsa.txt" ]; then
            echo '::error::New critical dependency advisories are outside the project security ratchet:'
            cat "$RUNNER_TEMP/new-ghsa.txt"
            exit 1
          fi

          echo '::warning::Critical audit findings are limited to explicitly baselined advisory IDs. Remediation remains required.'
          if [ -s "$RUNNER_TEMP/stale-allowlist.txt" ]; then
            echo '::warning::Some allowlisted critical advisories were not observed and may be removable:'
            cat "$RUNNER_TEMP/stale-allowlist.txt"
          fi

  high-signal-secret-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: false

      - name: Reject high-confidence committed credential material
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, sys
          from pathlib import Path

          token_patterns = [
              ('stripe-live-key', re.compile(r'sk_live_[A-Za-z0-9]{16,}')),
              ('github-fine-grained-pat', re.compile(r'github_pat_[A-Za-z0-9_]{20,}')),
              ('github-classic-pat', re.compile(r'ghp_[A-Za-z0-9]{20,}')),
              ('aws-access-key', re.compile(r'AKIA[0-9A-Z]{16}')),
              ('anthropic-api-key', re.compile(r'sk-ant-[A-Za-z0-9_-]{20,}')),
              ('openai-api-key', re.compile(r'sk-(?!ant-)(?:(?:proj|svcacct)-)?[A-Za-z0-9_-]{20,}')),
          ]
          pem = re.compile(
              r'-----BEGIN (?:(?:RSA|EC|OPENSSH) )?PRIVATE KEY-----'
              r'\s+([A-Za-z0-9+/=\r\n]{80,}?)\s+'
              r'-----END (?:(?:RSA|EC|OPENSSH) )?PRIVATE KEY-----',
              re.S,
          )

          skip_dirs = {'.git', 'node_modules', '.next', 'dist', 'build', 'coverage'}
          findings = []
          root = Path('.')
          for path in root.rglob('*'):
              if not path.is_file() or any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  if path.stat().st_size > 2_000_000:
                      continue
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for kind, pattern in token_patterns:
                  if pattern.search(text):
                      findings.append((str(path), kind))
              if pem.search(text):
                  findings.append((str(path), 'private-key-block'))

          if findings:
              for path, kind in sorted(set(findings)):
                  print(f'::error file={path}::High-confidence committed credential material detected ({kind}).')
              raise SystemExit(1)
          print('No high-confidence credential formats found.')
          PY
