name: Reusable SLO and error-budget evaluator

on:
  workflow_call:
    inputs:
      slo_input_json:
        description: 'Redacted aggregate counters only: {environment,objectives:[{id,target,good_events,total_events,source?}]}'
        required: true
        type: string
      caution_ratio:
        required: false
        type: number
        default: 0.5
    outputs:
      status:
        value: ${{ jobs.evaluate.outputs.status }}
      evidence_sha256:
        value: ${{ jobs.evaluate.outputs.evidence_sha256 }}
      state_json:
        value: ${{ jobs.evaluate.outputs.state_json }}

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ steps.eval.outputs.status }}
      evidence_sha256: ${{ steps.eval.outputs.evidence_sha256 }}
      state_json: ${{ steps.eval.outputs.state_json }}
    env:
      SLO_INPUT_JSON: ${{ inputs.slo_input_json }}
      CAUTION_RATIO: ${{ inputs.caution_ratio }}
    steps:
      - name: Calculate objective and aggregate budget state
        id: eval
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt, hashlib, json, os
          from decimal import Decimal, InvalidOperation

          d = json.loads(os.environ['SLO_INPUT_JSON'], parse_float=Decimal)
          env = d.get('environment')
          if env not in {'staging','production'}:
              raise SystemExit('environment must be staging or production')
          objs = d.get('objectives')
          if not isinstance(objs, list) or not objs:
              raise SystemExit('at least one SLO objective is required')
          try:
              caution = Decimal(str(os.environ['CAUTION_RATIO']))
          except InvalidOperation:
              raise SystemExit('invalid caution_ratio')
          if not (Decimal('0') < caution < Decimal('1')):
              raise SystemExit('caution_ratio must be between 0 and 1')

          out = []
          states = []
          for obj in objs:
              oid = str(obj.get('id','')).strip()
              try:
                  target = Decimal(str(obj.get('target')))
                  good = int(obj.get('good_events'))
                  total = int(obj.get('total_events'))
              except (InvalidOperation, TypeError, ValueError):
                  raise SystemExit(f'invalid SLO objective: {obj}')
              if not oid or not (Decimal('0') < target <= Decimal('1')) or good < 0 or total < 0 or good > total:
                  raise SystemExit(f'invalid SLO objective: {obj}')

              if total == 0:
                  ratio, state = None, 'unknown'
              else:
                  bad = Decimal(total - good)
                  allowed_bad = (Decimal('1') - target) * Decimal(total)
                  if allowed_bad <= 0:
                      ratio = Decimal('0') if bad == 0 else None
                      state = 'healthy' if bad == 0 else 'exhausted'
                  else:
                      ratio = bad / allowed_bad
                      if ratio >= Decimal('1'):
                          state = 'exhausted'
                      elif ratio >= caution:
                          state = 'caution'
                      else:
                          state = 'healthy'

              states.append(state)
              out.append({
                  'id': oid,
                  'target': float(target),
                  'good_events': good,
                  'total_events': total,
                  'budget_consumed_ratio': None if ratio is None else float(ratio.quantize(Decimal('0.000001'))),
                  'status': state,
                  'source': str(obj.get('source',''))
              })

          if 'exhausted' in states:
              overall = 'exhausted'
          elif 'unknown' in states:
              overall = 'unknown'
          elif 'caution' in states:
              overall = 'caution'
          else:
              overall = 'healthy'

          state = {
              'version': 1,
              'observed_at': dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00','Z'),
              'environment': env,
              'status': overall,
              'objectives': out,
              'notes': ['Aggregate counters only; no customer payloads retained.']
          }
          canonical = json.dumps(state, separators=(',', ':'), sort_keys=True)
          digest = hashlib.sha256(canonical.encode()).hexdigest()
          print(f'status={overall}')
          print(f'evidence_sha256={digest}')
          print(f'state_json={canonical}')
          PY
