name: Control-plane CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: control-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Parse JSON assets
        run: |
          set -euo pipefail
          for f in schemas/*.json templates/project/.agentic/platform-ops.json examples/*.platform-ops.json; do
            python -m json.tool "$f" >/dev/null
          done

      - name: Validate project-contract safety invariants
        run: |
          python scripts/validate_contract.py \
            templates/project/.agentic/platform-ops.json \
            examples/*.platform-ops.json

      - name: Negative-test contract guardrails
        run: |
          set -euo pipefail
          cp templates/project/.agentic/platform-ops.json /tmp/unsafe.json
          python - <<'PY'
          import json
          p='/tmp/unsafe.json'; d=json.load(open(p)); d['risk']['escalationDomains'].remove('secrets'); json.dump(d, open(p,'w'))
          PY
          if python scripts/validate_contract.py /tmp/unsafe.json; then echo '::error::Validator allowed removal of a default RED escalation domain.'; exit 1; fi

          cp templates/project/.agentic/platform-ops.json /tmp/unsafe-production.json
          python - <<'PY'
          import json
          p='/tmp/unsafe-production.json'; d=json.load(open(p)); d['environments']['production']['protected']=False; json.dump(d, open(p,'w'))
          PY
          if python scripts/validate_contract.py /tmp/unsafe-production.json; then echo '::error::Validator allowed an unprotected production environment.'; exit 1; fi

          cp templates/project/.agentic/platform-ops.json /tmp/unsafe-repair.json
          python - <<'PY'
          import json
          p='/tmp/unsafe-repair.json'; d=json.load(open(p)); d['project']['autonomyLevel']=2; d['repair']['enabled']=True; d['repair']['reproductionRequired']=False; json.dump(d, open(p,'w'))
          PY
          if python scripts/validate_contract.py /tmp/unsafe-repair.json; then echo '::error::Validator allowed autonomous repair without reproduction evidence.'; exit 1; fi

          cp templates/project/.agentic/platform-ops.json /tmp/unsafe-mitigation.json
          python - <<'PY'
          import json
          p='/tmp/unsafe-mitigation.json'; d=json.load(open(p)); d['mitigations']=[{'id':'unsafe-retry','type':'retry-idempotent-job','runbook':'runbooks/webhook-backlog.md','autonomousAllowed':True,'reversible':False,'validationCommand':''}]; json.dump(d, open(p,'w'))
          PY
          if python scripts/validate_contract.py /tmp/unsafe-mitigation.json; then echo '::error::Validator allowed an unsafe autonomous mitigation.'; exit 1; fi

      - name: Assert third-party Actions are immutable
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r line; do
            ref="$(printf '%s' "$line" | sed -E 's/^[[:space:]]*-[[:space:]]*uses:[[:space:]]*//; s/[[:space:]#].*$//')"
            case "$ref" in ./*) continue ;; esac
            if ! printf '%s' "$ref" | grep -Eq '@[0-9a-f]{40}$'; then
              echo "::error::Unpinned action reference: $ref"; bad=1
            fi
          done < <(grep -RhE '^[[:space:]]*-[[:space:]]*uses:' .github/workflows || true)
          test "$bad" -eq 0

      - name: Assert bounded-repair workflow stays PR-only
        shell: bash
        run: |
          set -euo pipefail
          FILE=.github/workflows/reusable-bounded-repair.yml
          grep -q 'gh pr create' "$FILE"
          grep -q "CENTRAL_PROTECTED='^(\\\\.github/|\\\\.agentic/|\\\\.env)'" "$FILE"
          if grep -EIn -- 'gh pr merge|kubectl[[:space:]]+apply|terraform[[:space:]]+apply|vercel[[:space:]].*--prod|aws[[:space:]].*deploy' "$FILE"; then
            echo '::error::Central bounded-repair workflow contains a direct merge/deploy command.'; exit 1
          fi

      - name: Assert product routing safety invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          router = Path('.github/workflows/reusable-issue-router.yml').read_text()
          dispatch = Path('.github/workflows/reusable-incident-dispatcher.yml').read_text()
          product = Path('.github/workflows/reusable-product-intake.yml').read_text()

          checks = {
              'router defines feature category': '- feature: new or changed product capability/behavior' in router,
              'router labels by classified kind': 'LABEL="kind:$KIND"' in router,
              'router does not grant repair marker': '**Auto-PR eligible:** `True`' not in router,
              'dispatcher explicitly excludes feature': "'kind:feature' in labels" in dispatch,
              'dispatcher requires defect/incident kinds': "{'kind:bug', 'kind:incident'}" in dispatch,
              'product source permission is read-only': '\n  contents: read\n' in product,
              'product uses pinned Codex reviewer': 'openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e' in product,
              'Codex reviewer is filesystem read-only': "permission-profile: ':read-only'" in product,
          }
          forbidden = ['contents: write', 'git push', 'gh pr create', 'gh pr merge', 'kubectl apply', 'terraform apply', 'vercel --prod']
          for term in forbidden:
              checks[f'product forbids {term}'] = term not in product

          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              for name in failed: print(f'::error::{name}')
              raise SystemExit(1)
          for name in checks: print(f'PASS {name}')
          PY

      - name: Ensure caller templates demand an explicit central ref
        run: |
          set -euo pipefail
          count=$(grep -RIl 'agentic-platform-operations/.github/workflows/' templates/project/.github/workflows | wc -l | tr -d ' ')
          pinned=$(grep -RIl '@PINNED_REF' templates/project/.github/workflows | wc -l | tr -d ' ')
          test "$count" -eq "$pinned" || {
            echo "::error::$count central workflow callers exist but only $pinned require PINNED_REF"; exit 1
          }
