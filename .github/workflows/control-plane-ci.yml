name: Control-plane CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: control-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v5, pinned to immutable commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # actions/setup-python v6, pinned to immutable commit.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Parse JSON assets
        run: |
          set -euo pipefail
          for f in schemas/*.json templates/project/.agentic/platform-ops.json examples/*.platform-ops.json; do
            python -m json.tool "$f" >/dev/null
          done

      - name: Validate project-contract safety invariants
        run: |
          python scripts/validate_contract.py \
            templates/project/.agentic/platform-ops.json \
            examples/*.platform-ops.json

      - name: Negative-test contract guardrails
        run: |
          set -euo pipefail
          cp templates/project/.agentic/platform-ops.json /tmp/unsafe.json
          python - <<'PY'
          import json
          p='/tmp/unsafe.json'
          d=json.load(open(p))
          d['risk']['escalationDomains'].remove('secrets')
          json.dump(d, open(p,'w'))
          PY
          if python scripts/validate_contract.py /tmp/unsafe.json; then
            echo '::error::Validator allowed removal of a default RED escalation domain.'
            exit 1
          fi

          cp templates/project/.agentic/platform-ops.json /tmp/unsafe-production.json
          python - <<'PY'
          import json
          p='/tmp/unsafe-production.json'
          d=json.load(open(p))
          d['environments']['production']['protected']=False
          json.dump(d, open(p,'w'))
          PY
          if python scripts/validate_contract.py /tmp/unsafe-production.json; then
            echo '::error::Validator allowed an unprotected production environment.'
            exit 1
          fi

          cp templates/project/.agentic/platform-ops.json /tmp/unsafe-repair.json
          python - <<'PY'
          import json
          p='/tmp/unsafe-repair.json'
          d=json.load(open(p))
          d['project']['autonomyLevel']=2
          d['repair']['enabled']=True
          d['repair']['reproductionRequired']=False
          json.dump(d, open(p,'w'))
          PY
          if python scripts/validate_contract.py /tmp/unsafe-repair.json; then
            echo '::error::Validator allowed autonomous repair without reproduction evidence.'
            exit 1
          fi

          cp templates/project/.agentic/platform-ops.json /tmp/unsafe-mitigation.json
          python - <<'PY'
          import json
          p='/tmp/unsafe-mitigation.json'
          d=json.load(open(p))
          d['mitigations']=[{
            'id':'unsafe-retry','type':'retry-idempotent-job','runbook':'runbooks/webhook-backlog.md',
            'autonomousAllowed':True,'reversible':False,'validationCommand':''
          }]
          json.dump(d, open(p,'w'))
          PY
          if python scripts/validate_contract.py /tmp/unsafe-mitigation.json; then
            echo '::error::Validator allowed an unsafe autonomous mitigation.'
            exit 1
          fi

      - name: Assert third-party Actions are immutable
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r line; do
            ref="$(printf '%s' "$line" | sed -E 's/^[[:space:]]*-[[:space:]]*uses:[[:space:]]*//; s/[[:space:]#].*$//')"
            case "$ref" in
              ./*) continue ;;
            esac
            if ! printf '%s' "$ref" | grep -Eq '@[0-9a-f]{40}$'; then
              echo "::error::Unpinned action reference: $ref"
              bad=1
            fi
          done < <(grep -RhE '^[[:space:]]*-[[:space:]]*uses:' .github/workflows || true)
          test "$bad" -eq 0

      - name: Assert bounded-repair workflow stays PR-only
        shell: bash
        run: |
          set -euo pipefail
          FILE=.github/workflows/reusable-bounded-repair.yml
          grep -q 'gh pr create' "$FILE"
          grep -q "CENTRAL_PROTECTED='^(\\\\.github/|\\\\.agentic/|\\\\.env)'" "$FILE"

          if grep -EIn -- 'gh pr merge|kubectl[[:space:]]+apply|terraform[[:space:]]+apply|vercel[[:space:]].*--prod|aws[[:space:]].*deploy' "$FILE"; then
            echo '::error::Central bounded-repair workflow contains a direct merge/deploy command.'
            exit 1
          fi

      - name: Assert feature issues cannot enter reproduction
        shell: bash
        run: |
          set -euo pipefail
          ROUTER=.github/workflows/reusable-issue-router.yml
          DISPATCH=.github/workflows/reusable-incident-dispatcher.yml
          PRODUCT=.github/workflows/reusable-product-intake.yml

          grep -q "kind:feature" "$ROUTER"
          grep -q "kind:feature.*labels" "$DISPATCH" || grep -q "'kind:feature' in labels" "$DISPATCH"
          grep -q "{'kind:bug', 'kind:incident'}" "$DISPATCH"

          if grep -q '\*\*Auto-PR eligible:\*\* `True`' "$ROUTER"; then
            echo '::error::Issue router must never grant repair eligibility.'
            exit 1
          fi

          grep -q '^  contents: read$' "$PRODUCT"
          if grep -EIn -- 'contents:[[:space:]]*write|git[[:space:]]+push|gh[[:space:]]+pr[[:space:]]+(create|merge)|kubectl[[:space:]]+apply|terraform[[:space:]]+apply|vercel[[:space:]].*--prod' "$PRODUCT"; then
            echo '::error::Product intake workflow contains code-write, PR, merge, or deployment authority.'
            exit 1
          fi
          grep -q 'openai/codex-action@[0-9a-f]\{40\}' "$PRODUCT"
          grep -q "permission-profile: ':read-only'" "$PRODUCT"

      - name: Ensure caller templates demand an explicit central ref
        run: |
          set -euo pipefail
          count=$(grep -RIl 'agentic-platform-operations/.github/workflows/' templates/project/.github/workflows | wc -l | tr -d ' ')
          pinned=$(grep -RIl '@PINNED_REF' templates/project/.github/workflows | wc -l | tr -d ' ')
          test "$count" -eq "$pinned" || {
            echo "::error::$count central workflow callers exist but only $pinned require PINNED_REF"
            exit 1
          }
